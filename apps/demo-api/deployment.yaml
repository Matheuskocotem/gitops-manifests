
apiVersion: v1
kind: Namespace
metadata:
  name: demo-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo-api
  labels:
    app: demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      containers:
        - name: demo-api
          image: demo-api:0.0.1
          # CRUCIAL: usa a imagem local carregada via 'kind load'.
          # Sem isso, o K8s tentaria baixar de um registry remoto e falharia.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Probes: o K8s usa os endpoints do Actuator pra saber se a app está viva/pronta.
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: demo-api
  labels:
    app: demo-api
spec:
  selector:
    app: demo-api
  ports:
    - name: http           # nome importa: o ServiceMonitor vai referenciar por esse nome
      port: 8080
      targetPort: 8080
  type: ClusterIP